<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>계정 관리 (비공개)</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  body { background: var(--color-surface); }
  .admin-shell { max-width: 820px; margin: 0 auto; padding: 32px 24px 80px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .admin-header h1 { font-size: 22px; font-weight: 800; color: var(--color-ink); }
  .admin-header p { font-size: 13.5px; color: var(--color-muted); margin-top: 4px; }

  .panel { background: #fff; border: 1px solid var(--color-line); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 18px; }
  .panel h2 { font-size: 15px; font-weight: 800; color: var(--color-ink); margin-bottom: 6px; }
  .panel .hint { font-size: 13px; color: var(--color-muted); line-height: 1.75; }

  .acct { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--color-line); flex-wrap: wrap; }
  .acct:first-of-type { border-top: none; }
  .acct .who { flex: 1 1 180px; min-width: 0; }
  .acct .who b { font-size: 15px; font-weight: 800; color: var(--color-ink); }
  .acct .role {
    display: inline-block; font-size: 11.5px; font-weight: 800; border-radius: 999px;
    padding: 3px 10px; margin-left: 7px; vertical-align: 2px;
  }
  .role.admin { background: var(--color-primary-light); color: var(--color-primary-dark); }
  .role.manager { background: #eef0fb; color: #4b3fa8; }
  .role.office { background: #e6effb; color: #2b5aa8; }
  .role.instructor { background: #e9f7ee; color: #1c8a4f; }
  .acct .who span { display: block; font-size: 12.5px; color: var(--color-muted); margin-top: 3px; }
  .acct input[type="password"] {
    width: 190px; border: 1px solid var(--color-line); border-radius: var(--radius-sm);
    padding: 9px 11px; font-family: inherit; font-size: 14px; color: var(--color-ink);
  }
  .acct input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-light); }

  .new-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-top: 14px; }
  .new-row label { display: block; font-size: 12.5px; font-weight: 700; color: var(--color-muted); margin-bottom: 6px; }
  .new-row input {
    border: 1px solid var(--color-line); border-radius: var(--radius-sm);
    padding: 10px 12px; font-family: inherit; font-size: 14.5px; color: var(--color-ink);
  }

  .status { font-size: 13.5px; font-weight: 600; margin-top: 14px; min-height: 20px; }
  .status.ok { color: #1c8a4f; }
  .status.err { color: #c53030; }

  .warn {
    background: #fff8e6; border: 1px solid #ffe1a8; border-radius: var(--radius-md);
    padding: 14px 16px; font-size: 13px; color: #8a6100; line-height: 1.75;
  }
</style>
</head>
<body>

<div class="admin-shell">
  <div class="admin-header">
    <div>
      <h1>계정 관리</h1>
      <p>셔틀 명단을 작성할 직원 계정(office)의 비밀번호를 정하고 관리합니다.</p>
    </div>
    <a href="admin.html" class="btn btn-outline btn-sm">관리자 홈</a>
  </div>

  <div class="panel">
    <h2>계정 목록</h2>
    <p class="hint">
      <strong>최고관리자</strong>는 전체 + 계정 관리, <strong>사무실</strong>은 계정 관리를 뺀 전체,
      <strong>셔틀계정</strong>은 셔틀 명단만, <strong>강사</strong>는 본인 예약만 조회할 수 있습니다.
      한 계정이 여러 역할을 겸직할 수 있습니다.
    </p>
    <div id="acctList" style="margin-top:16px;">
      <p class="hint">불러오는 중...</p>
    </div>
    <p class="status" id="status"></p>
  </div>

  <div class="panel">
    <h2>계정 추가</h2>
    <p class="hint">직원이 더 필요하면 여기서 계정을 만드세요 (최고관리자 계정은 이 화면에서 늘릴 수 없습니다). 역할은 여러 개 선택할 수 있습니다.</p>
    <div class="new-row">
      <div>
        <label for="newUser">아이디</label>
        <input type="text" id="newUser" placeholder="예: office4" autocomplete="off" />
      </div>
      <div>
        <label for="newPw">비밀번호 (8자 이상)</label>
        <input type="password" id="newPw" autocomplete="new-password" />
      </div>
    </div>
    <div class="new-row" style="margin-top:14px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--color-ink);">
        <input type="checkbox" class="new-role" value="manager" /> 사무실
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--color-ink);">
        <input type="checkbox" class="new-role" value="office" /> 셔틀계정
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--color-ink);">
        <input type="checkbox" class="new-role" value="instructor" /> 강사
      </label>
    </div>
    <div class="new-row" id="newRealNameRow" style="margin-top:10px;display:none;">
      <div>
        <label for="newRealName">강사 실명 (학사서버 담당강사 이름과 동일하게, 비공개)</label>
        <input type="text" id="newRealName" placeholder="예: 김철수" autocomplete="off" />
      </div>
    </div>
    <div class="new-row" style="margin-top:14px;">
      <button type="button" id="btnCreate" class="btn btn-primary btn-sm">계정 만들기</button>
    </div>
  </div>
</div>

<script>
(function () {
"use strict";

var listEl = document.getElementById("acctList");
var statusEl = document.getElementById("status");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function setStatus(msg, kind) {
  statusEl.textContent = msg || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}
function post(payload) {
  return fetch("api/accounts.php", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function (r) {
    return r.json().then(function (j) {
      if (!r.ok || j.error) { throw new Error(j.error || "요청에 실패했습니다."); }
      return j;
    });
  });
}

var ROLE_LABEL = { admin: "최고관리자", manager: "사무실", office: "셔틀계정", instructor: "강사" };

function render(users, me) {
  if (!users.length) { listEl.innerHTML = '<p class="hint">계정이 없습니다.</p>'; return; }
  listEl.innerHTML = users.map(function (u) {
    var roles = u.roles && u.roles.length ? u.roles : ["admin"];
    var isAdmin = roles.indexOf("admin") >= 0;
    var badges = roles.map(function (r) {
      return '<span class="role ' + esc(r) + '">' + esc(ROLE_LABEL[r] || r) + '</span>';
    }).join("");
    var realNameNote = u.realName ? '<span>실명: ' + esc(u.realName) + '</span>' : '';
    return '<div class="acct" data-user="' + esc(u.username) + '">'
      + '<div class="who"><b>' + esc(u.username) + '</b>' + badges
      +   (u.username === me ? '<span>지금 로그인한 계정</span>' : '')
      +   realNameNote
      + '</div>'
      + '<input type="password" class="f-pw" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" />'
      + '<button type="button" class="btn btn-outline btn-sm btn-pw">변경</button>'
      + (!isAdmin && u.username !== me
          ? '<button type="button" class="btn btn-outline btn-sm btn-del">삭제</button>' : '')
      + '</div>';
  }).join("");
}

function load() {
  fetch("api/accounts.php", { credentials: "same-origin" })
    .then(function (r) {
      if (r.status === 401) { throw new Error("로그인이 필요합니다. 관리자 홈에서 로그인해주세요."); }
      if (r.status === 403) { throw new Error("이 화면은 관리자 계정만 사용할 수 있습니다."); }
      if (!r.ok) {
        return r.json().catch(function () { return null; }).then(function (body) {
          throw new Error(body && body.error ? body.error : "서버(api)에 접속할 수 없습니다. (HTTP " + r.status + ")");
        });
      }
      return r.json();
    })
    .then(function (res) { render(res.users || [], res.me); setStatus(""); })
    .catch(function (err) { listEl.innerHTML = ""; setStatus(err.message, "err"); });
}

listEl.addEventListener("click", function (e) {
  var row = e.target.closest(".acct");
  if (!row) { return; }
  var user = row.getAttribute("data-user");

  if (e.target.classList.contains("btn-pw")) {
    var pwEl = row.querySelector(".f-pw");
    var pw = pwEl.value;
    if (pw.length < 8) { setStatus("비밀번호는 8자 이상으로 정해주세요.", "err"); return; }
    setStatus("변경 중...");
    post({ action: "set_password", username: user, password: pw })
      .then(function () { pwEl.value = ""; setStatus(user + " 계정의 비밀번호를 변경했습니다.", "ok"); })
      .catch(function (err) { setStatus(err.message, "err"); });
  }

  if (e.target.classList.contains("btn-del")) {
    if (!window.confirm(user + " 계정을 삭제할까요?")) { return; }
    setStatus("삭제 중...");
    post({ action: "delete", username: user })
      .then(function () { setStatus(user + " 계정을 삭제했습니다.", "ok"); load(); })
      .catch(function (err) { setStatus(err.message, "err"); });
  }
});

var roleChecks = document.querySelectorAll(".new-role");
var realNameRow = document.getElementById("newRealNameRow");
function syncRealNameVisibility() {
  var hasInstructor = Array.prototype.some.call(roleChecks, function (c) { return c.value === "instructor" && c.checked; });
  realNameRow.style.display = hasInstructor ? "flex" : "none";
}
Array.prototype.forEach.call(roleChecks, function (c) { c.addEventListener("change", syncRealNameVisibility); });

document.getElementById("btnCreate").addEventListener("click", function () {
  var u = document.getElementById("newUser").value.trim();
  var p = document.getElementById("newPw").value;
  var roles = Array.prototype.filter.call(roleChecks, function (c) { return c.checked; }).map(function (c) { return c.value; });
  var realName = document.getElementById("newRealName").value.trim();
  if (!u) { setStatus("아이디를 입력해주세요.", "err"); return; }
  if (p.length < 8) { setStatus("비밀번호는 8자 이상으로 정해주세요.", "err"); return; }
  if (!roles.length) { setStatus("역할을 하나 이상 선택해주세요.", "err"); return; }
  if (roles.indexOf("instructor") >= 0 && !realName) { setStatus("강사 역할은 실명을 입력해주세요.", "err"); return; }
  setStatus("만드는 중...");
  post({ action: "create", username: u, password: p, roles: roles.join(","), realName: realName })
    .then(function () {
      document.getElementById("newUser").value = "";
      document.getElementById("newPw").value = "";
      document.getElementById("newRealName").value = "";
      Array.prototype.forEach.call(roleChecks, function (c) { c.checked = false; });
      syncRealNameVisibility();
      setStatus(u + " 계정을 만들었습니다.", "ok");
      load();
    })
    .catch(function (err) { setStatus(err.message, "err"); });
});

load();
})();
</script>
</body>
</html>
