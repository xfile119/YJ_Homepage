<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 모드 (비공개)</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  body { background: var(--color-surface); }
  .admin-shell { max-width: 640px; margin: 0 auto; padding: 48px 24px 80px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .admin-header h1 { font-size: 22px; font-weight: 800; color: var(--color-ink); }
  .admin-warning {
    background: #fff4e5; border: 1px solid #ffe1b3; color: #8a5910;
    border-radius: var(--radius-md); padding: 16px 18px; font-size: 13.5px; line-height: 1.7; margin-bottom: 28px;
  }
  .admin-section { background: #fff; border: 1px solid var(--color-line); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 22px; }
  .login-row { display: flex; flex-direction: column; gap: 10px; }
  .login-row input {
    border: 1px solid var(--color-line); border-radius: var(--radius-sm);
    padding: 11px 13px; font-size: 14px; font-family: inherit; color: var(--color-ink);
  }
  .login-row input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-light); }
  #loginError { color: #d64545; font-size: 13px; font-weight: 700; margin-top: 10px; display: none; }
  .tool-list { display: flex; flex-direction: column; gap: 14px; }
  .tool-card {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border: 1px solid var(--color-line); border-radius: var(--radius-md); padding: 18px 20px; flex-wrap: wrap;
  }
  .tool-card h3 { font-size: 15.5px; font-weight: 800; color: var(--color-ink); margin-bottom: 4px; }
  .tool-card p { font-size: 12.5px; color: var(--color-muted); line-height: 1.6; }
  #unlockedPanel, #loginPanel { display: none; }
  #checkingMsg { font-size: 13px; color: var(--color-muted); }
</style>
</head>
<body>

<div class="admin-shell">
  <div class="admin-header">
    <h1>관리자 모드</h1>
    <a href="index.html" class="btn btn-outline btn-sm">← 홈으로</a>
  </div>

  <div class="admin-warning">
    <strong>이 페이지는 비공개 도구입니다.</strong> 홈페이지 메뉴 어디에도 연결되어 있지 않고 검색엔진에도 노출되지 않아요.<br>
    로그인은 서버의 관리자 계정(DB에 저장된 아이디/비밀번호)으로 확인합니다. 여기서 저장한 내용은 <strong>바로 실제 홈페이지에 반영</strong>됩니다.
  </div>

  <p id="checkingMsg">로그인 상태 확인 중...</p>

  <div class="admin-section" id="loginPanel">
    <h2 style="font-size:16px;font-weight:800;color:var(--color-ink);margin-bottom:14px;">관리자 로그인</h2>
    <div class="login-row">
      <input type="text" id="userInput" placeholder="아이디" autocomplete="username" />
      <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="current-password" />
      <button type="button" id="btnLogin" class="btn btn-primary">로그인</button>
    </div>
    <p id="loginError"></p>
  </div>

  <div class="admin-section" id="unlockedPanel">
    <h2 style="font-size:16px;font-weight:800;color:var(--color-ink);margin-bottom:18px;">관리 도구</h2>
    <div class="tool-list">
      <div class="tool-card">
        <div>
          <h3>공지사항 관리</h3>
          <p>공지사항 추가·수정·삭제, 홈 화면 미리보기 반영</p>
        </div>
        <a href="admin-notice.html" class="btn btn-primary btn-sm">열기</a>
      </div>
      <div class="tool-card">
        <div>
          <h3>수강료 · 교육시간 관리</h3>
          <p>면허가이드 페이지의 학원 정보, 응시료, 케이스별 교육시간·수강료 수정</p>
        </div>
        <a href="admin-license.html" class="btn btn-primary btn-sm">열기</a>
      </div>
    </div>
    <button type="button" id="btnLock" class="btn btn-outline btn-sm" style="margin-top:20px;">로그아웃</button>
  </div>
</div>

<script>
(function(){
"use strict";

var checkingMsg = document.getElementById("checkingMsg");
var loginPanel = document.getElementById("loginPanel");
var unlockedPanel = document.getElementById("unlockedPanel");
var userInput = document.getElementById("userInput");
var pwInput = document.getElementById("pwInput");
var loginError = document.getElementById("loginError");

function showLogin(){
  checkingMsg.style.display = "none";
  loginPanel.style.display = "block";
  unlockedPanel.style.display = "none";
}
function showUnlocked(){
  checkingMsg.style.display = "none";
  loginPanel.style.display = "none";
  unlockedPanel.style.display = "block";
}
function showError(msg){
  loginError.textContent = msg;
  loginError.style.display = "block";
}

fetch("api/auth.php").then(function(r){ return r.json(); }).then(function(res){
  if (res && res.loggedIn) showUnlocked(); else showLogin();
}).catch(function(){
  showLogin();
  loginError.textContent = "서버(api/auth.php) 상태 확인에 실패했습니다. DB 연동 배포 전(정적 미리보기)이거나 서버 설정에 문제가 있을 수 있어요. 그래도 로그인을 시도해볼 수 있습니다.";
  loginError.style.display = "block";
});

document.getElementById("btnLogin").addEventListener("click", function(){
  loginError.style.display = "none";
  fetch("api/auth.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "login", username: userInput.value, password: pwInput.value })
  }).then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
    .then(function(res){
      if (res.ok) { showUnlocked(); } else { showError(res.data.error || "로그인에 실패했습니다."); }
    }).catch(function(){ showError("서버에 접속할 수 없습니다."); });
});
pwInput.addEventListener("keydown", function(e){
  if (e.key === "Enter") document.getElementById("btnLogin").click();
});
document.getElementById("btnLock").addEventListener("click", function(){
  fetch("api/auth.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "logout" })
  }).finally(function(){
    userInput.value = ""; pwInput.value = "";
    showLogin();
  });
});

})();
</script>
</body>
</html>
