<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>차량 운행 명단 관리 (비공개)</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  body { background: var(--color-surface); }
  .admin-shell { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .admin-header h1 { font-size: 22px; font-weight: 800; color: var(--color-ink); }
  .admin-header p { font-size: 13.5px; color: var(--color-muted); margin-top: 4px; }
  .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .panel { background: #fff; border: 1px solid var(--color-line); border-radius: var(--radius-lg); padding: 22px 24px; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; font-weight: 800; color: var(--color-ink); margin-bottom: 6px; }
  .panel .hint { font-size: 13px; color: var(--color-muted); line-height: 1.7; }

  .date-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .date-row label { display: block; font-size: 12.5px; font-weight: 700; color: var(--color-muted); margin-bottom: 6px; }
  .date-row input[type="date"] {
    border: 1px solid var(--color-line); border-radius: var(--radius-sm); padding: 10px 12px;
    font-family: inherit; font-size: 15px; color: var(--color-ink);
  }

  /* ── 실제 종이 양식과 같은 2단 배치 ── */
  .slot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 980px) { .slot-grid { grid-template-columns: 1fr; } }

  .slot { border: 1px solid var(--color-line); border-radius: var(--radius-md); overflow: hidden; background: #fff; }
  .slot-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: var(--color-primary-light); border-bottom: 1px solid var(--color-line);
  }
  .slot-head input.slot-time {
    width: 92px; border: 1px solid var(--color-line); border-radius: 6px; padding: 7px 9px;
    font-family: inherit; font-size: 15px; font-weight: 800; color: var(--color-ink); text-align: center; background: #fff;
  }
  .slot-head .slot-label { font-size: 13px; font-weight: 700; color: var(--color-primary-dark); }
  .slot-head .slot-count { margin-left: auto; font-size: 12.5px; color: var(--color-muted); }
  .slot-head button { margin-left: 8px; }

  table.rider-table { width: 100%; border-collapse: collapse; }
  table.rider-table th {
    font-size: 12px; font-weight: 700; color: var(--color-muted); background: var(--color-surface);
    padding: 8px 6px; border-bottom: 1px solid var(--color-line); text-align: center;
  }
  table.rider-table td { padding: 0; border-bottom: 1px solid var(--color-line); }
  table.rider-table input {
    width: 100%; border: none; background: transparent; padding: 10px 8px;
    font-family: inherit; font-size: 14px; color: var(--color-ink);
  }
  table.rider-table input:focus { outline: 2px solid var(--color-primary); outline-offset: -2px; border-radius: 4px; }
  table.rider-table td.col-del { width: 34px; text-align: center; }
  .btn-del-row {
    border: none; background: transparent; color: var(--color-muted); font-size: 15px;
    line-height: 1; padding: 6px; cursor: pointer; border-radius: 4px;
  }
  .btn-del-row:hover { background: #fdeeee; color: #c53030; }
  .slot-foot { padding: 10px 12px; }

  .status { font-size: 13.5px; font-weight: 600; margin-top: 12px; min-height: 20px; }
  .status.ok { color: #1c8a4f; }
  .status.err { color: #c53030; }

  /* ── 인쇄용: 기존 종이 양식처럼 ── */
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .admin-shell { padding: 0; max-width: none; }
    .panel { border: none; padding: 0; margin: 0; }
    .print-title { display: block !important; text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 14px; }
    .slot-grid { grid-template-columns: 1fr 1fr; gap: 0; }
    .slot { border: 1px solid #000; border-radius: 0; }
    .slot-head { background: #fff; border-bottom: 1px solid #000; }
    table.rider-table th, table.rider-table td { border: 1px solid #999; }
    table.rider-table input { padding: 6px 4px; }
    .col-del { display: none; }
  }
  .print-title { display: none; }
</style>
</head>
<body>

<div class="admin-shell">
  <div class="admin-header no-print">
    <div>
      <h1>차량 운행 명단 관리</h1>
      <p>날짜별 셔틀 탑승 명단을 작성합니다. 저장하면 수강생이 <strong>셔틀 조회</strong> 페이지에서 본인 탑승 시간·장소를 확인할 수 있어요.</p>
    </div>
    <div class="admin-actions">
      <a href="admin.html" class="btn btn-outline btn-sm">관리자 홈</a>
      <a href="shuttle.html" class="btn btn-outline btn-sm" target="_blank" rel="noopener">조회 화면 보기</a>
      <button type="button" class="btn btn-outline btn-sm" onclick="window.print()">인쇄</button>
      <button type="button" id="btnSave" class="btn btn-primary btn-sm">저장하기</button>
    </div>
  </div>

  <div class="panel no-print" id="datePanel">
    <h2>운행 날짜</h2>
    <p class="hint">날짜를 바꾸면 그 날짜의 명단을 불러옵니다. 저장은 <strong>선택한 날짜의 명단 전체를 교체</strong>합니다.</p>
    <div class="date-row" style="margin-top:14px;">
      <div>
        <label for="rideDate">날짜</label>
        <input type="date" id="rideDate" />
      </div>
      <button type="button" id="btnLoad" class="btn btn-outline btn-sm">불러오기</button>
      <button type="button" id="btnAddSlot" class="btn btn-outline btn-sm">시간대 추가</button>
    </div>
    <p class="status" id="status"></p>
  </div>

  <div class="print-title" id="printTitle">차량 운행 명단</div>

  <div class="slot-grid" id="slotGrid"></div>
</div>

<script>
(function () {
"use strict";

var DEFAULT_TIMES = ["08:30", "13:30"];
var ROWS_PER_SLOT = 10;

var gridEl = document.getElementById("slotGrid");
var dateEl = document.getElementById("rideDate");
var statusEl = document.getElementById("status");
var printTitle = document.getElementById("printTitle");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function setStatus(msg, kind) {
  statusEl.textContent = msg || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}
function todayStr() {
  var d = new Date();
  var m = String(d.getMonth() + 1);
  var day = String(d.getDate());
  return d.getFullYear() + "-" + (m.length < 2 ? "0" + m : m) + "-" + (day.length < 2 ? "0" + day : day);
}

/* ---------- 렌더링 ---------- */
function slotHtml(time, riders) {
  var rows = "";
  var list = riders.slice();
  while (list.length < ROWS_PER_SLOT) { list.push({ name: "", place: "", phone: "" }); }
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    rows += '<tr>'
      + '<td><input class="f-name" value="' + esc(r.name) + '" /></td>'
      + '<td><input class="f-place" value="' + esc(r.place) + '" /></td>'
      + '<td><input class="f-phone" value="' + esc(r.phone) + '" inputmode="tel" /></td>'
      + '<td class="col-del"><button type="button" class="btn-del-row" title="이 줄 지우기">×</button></td>'
      + '</tr>';
  }
  return '<div class="slot">'
    + '<div class="slot-head">'
    +   '<input class="slot-time" value="' + esc(time) + '" placeholder="08:30" />'
    +   '<span class="slot-label">출발</span>'
    +   '<span class="slot-count"></span>'
    +   '<button type="button" class="btn btn-outline btn-sm btn-del-slot no-print">시간대 삭제</button>'
    + '</div>'
    + '<table class="rider-table">'
    +   '<thead><tr><th style="width:22%">성명</th><th style="width:40%">장소</th><th style="width:30%">연락처</th><th class="col-del"></th></tr></thead>'
    +   '<tbody>' + rows + '</tbody>'
    + '</table>'
    + '<div class="slot-foot no-print"><button type="button" class="btn btn-outline btn-sm btn-add-row">줄 추가</button></div>'
    + '</div>';
}

function render(slots) {
  gridEl.innerHTML = slots.map(function (s) { return slotHtml(s.time, s.riders); }).join("");
  updateCounts();
}

function updateCounts() {
  [].forEach.call(gridEl.querySelectorAll(".slot"), function (slot) {
    var n = 0;
    [].forEach.call(slot.querySelectorAll(".f-name"), function (inp) {
      if (inp.value.trim() !== "") { n++; }
    });
    slot.querySelector(".slot-count").textContent = n + "명";
  });
}

/* 이벤트 위임 */
gridEl.addEventListener("click", function (e) {
  var t = e.target;
  if (t.classList.contains("btn-del-row")) {
    var tr = t.closest("tr");
    [].forEach.call(tr.querySelectorAll("input"), function (i) { i.value = ""; });
    updateCounts();
  } else if (t.classList.contains("btn-add-row")) {
    var tbody = t.closest(".slot").querySelector("tbody");
    var tr2 = document.createElement("tr");
    tr2.innerHTML = '<td><input class="f-name" /></td><td><input class="f-place" /></td>'
      + '<td><input class="f-phone" inputmode="tel" /></td>'
      + '<td class="col-del"><button type="button" class="btn-del-row" title="이 줄 지우기">×</button></td>';
    tbody.appendChild(tr2);
  } else if (t.classList.contains("btn-del-slot")) {
    if (gridEl.querySelectorAll(".slot").length <= 1) {
      setStatus("시간대는 최소 1개는 있어야 합니다.", "err");
      return;
    }
    if (window.confirm("이 시간대를 통째로 지울까요? (저장해야 실제로 반영됩니다)")) {
      t.closest(".slot").remove();
    }
  }
});
gridEl.addEventListener("input", function (e) {
  if (e.target.classList.contains("f-name")) { updateCounts(); }
});

/* ---------- 수집 ---------- */
function collect() {
  var out = [];
  [].forEach.call(gridEl.querySelectorAll(".slot"), function (slot) {
    var time = slot.querySelector(".slot-time").value.trim();
    [].forEach.call(slot.querySelectorAll("tbody tr"), function (tr) {
      var name = tr.querySelector(".f-name").value.trim();
      if (name === "") { return; }
      out.push({
        time: time,
        name: name,
        place: tr.querySelector(".f-place").value.trim(),
        phone: tr.querySelector(".f-phone").value.trim()
      });
    });
  });
  return out;
}

/* ---------- 서버 연동 ---------- */
function load() {
  var date = dateEl.value;
  if (!date) { setStatus("날짜를 선택해주세요.", "err"); return; }
  printTitle.textContent = "차량 운행 명단 (" + date.slice(5).replace("-", "/") + ")";
  setStatus("불러오는 중...");
  fetch("api/shuttle.php?date=" + encodeURIComponent(date), { credentials: "same-origin" })
    .then(function (r) {
      if (r.status === 401) { throw new Error("로그인이 필요합니다. 관리자 홈에서 로그인해주세요."); }
      if (!r.ok) { throw new Error("서버(api)에 접속할 수 없습니다."); }
      return r.json();
    })
    .then(function (res) {
      var byTime = {};
      var order = [];
      (res.riders || []).forEach(function (r) {
        if (!byTime[r.time]) { byTime[r.time] = []; order.push(r.time); }
        byTime[r.time].push(r);
      });
      if (order.length === 0) { order = DEFAULT_TIMES.slice(); order.forEach(function (t) { byTime[t] = []; }); }
      render(order.map(function (t) { return { time: t, riders: byTime[t] }; }));
      setStatus(order.length + "개 시간대, 총 " + (res.riders || []).length + "명을 불러왔습니다.", "ok");
    })
    .catch(function (err) {
      render(DEFAULT_TIMES.map(function (t) { return { time: t, riders: [] }; }));
      setStatus(err.message + " (빈 양식으로 시작합니다)", "err");
    });
}

document.getElementById("btnLoad").addEventListener("click", load);
dateEl.addEventListener("change", load);

document.getElementById("btnAddSlot").addEventListener("click", function () {
  gridEl.insertAdjacentHTML("beforeend", slotHtml("", []));
  updateCounts();
});

document.getElementById("btnSave").addEventListener("click", function () {
  var date = dateEl.value;
  if (!date) { setStatus("날짜를 선택해주세요.", "err"); return; }
  var riders = collect();
  setStatus("저장 중...");
  fetch("api/shuttle.php", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "save_all", date: date, riders: riders })
  })
    .then(function (r) {
      if (r.status === 401) { throw new Error("로그인이 만료됐습니다. 관리자 홈에서 다시 로그인해주세요."); }
      return r.json();
    })
    .then(function (res) {
      if (res.error) { throw new Error(res.error); }
      setStatus(date + " 명단 " + riders.length + "명을 저장했습니다.", "ok");
    })
    .catch(function (err) { setStatus(err.message, "err"); });
});

/* 시작 */
dateEl.value = todayStr();
load();

})();
</script>
</body>
</html>
